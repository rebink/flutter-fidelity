name: fieldnotes_feed
description: ImageGen reference implemented as a measured, interactive Flutter feed.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fidelity_harness:
    path: ../../../flutter/fidelity_harness
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fidelity_fonts/
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fidelity_fonts/Lato-Regular.ttf
    - family: LatoBold
      fonts:
        - asset: assets/fidelity_fonts/Lato-Bold.ttf
